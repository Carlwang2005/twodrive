name: Isolated CFAPI adapter
on:
  pull_request:
    paths: ['experiments/windows-cfapi/**', 'crates/twodrive-core/**', 'experiments/twodrive-dev/src/local_files*', 'experiments/twodrive-dev/src/native_local_fixture.rs', 'experiments/twodrive-dev/src/desktop_local_files.rs', 'experiments/twodrive-dev/src/model.rs', 'experiments/twodrive-dev/src/provider.rs', 'scripts/build-cfapi-probe.ps1', 'scripts/test-generated-visual-dataset.py', 'scripts/test_generated_visual_dataset.py', 'scripts/capture-native-fixture-evidence.ps1', '.github/workflows/windows-cfapi.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ordinary-data validation on the hosted runner
        shell: pwsh
        run: |
          $fixture = Join-Path '${{ runner.temp }}' 'ordinary-visual-fixture'
          if ($IsWindows) {
            # Only this disposable GitHub VM: never install/configure a driver,
            # register a root, or run this setup on a local/self-hosted machine.
            if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Hosted runner required' }
            $driver = Get-CimInstance Win32_SystemDriver -Filter "Name='CldFlt'"
            if (!$driver) { throw 'Built-in CldFlt is unavailable; do not install it' }
            @{ driver='CldFlt'; before=$driver.State; start_mode=$driver.StartMode } | ConvertTo-Json -Compress
            if ($driver.State -eq 'Stopped') {
              sc.exe start CldFlt
              if ($LASTEXITCODE -notin @(0,1056)) { throw 'Cannot start existing CI CldFlt; no configuration changes allowed' }
            } elseif ($driver.State -ne 'Running') { throw 'Unknown CldFlt state' }
            for ($attempt=0; $attempt -lt 20; $attempt++) {
              $driver = Get-CimInstance Win32_SystemDriver -Filter "Name='CldFlt'"
              if ($driver.State -eq 'Running') { break }
              Start-Sleep -Milliseconds 250
            }
            if ($driver.State -ne 'Running') { throw 'CI CldFlt startup unconfirmed' }
            @{ driver='CldFlt'; after=$driver.State } | ConvertTo-Json -Compress
            $fixture = Join-Path "$env:SystemRoot/Temp" "twodrive-ordinary-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          }
          "TWODRIVE_ORDINARY_FIXTURE=$fixture" >> $env:GITHUB_ENV
      - run: python -m unittest discover -s scripts -p test_generated_visual_dataset.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path experiments/windows-cfapi/Cargo.toml -- --check
      - run: cargo clippy --manifest-path experiments/windows-cfapi/Cargo.toml --all-features --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path experiments/windows-cfapi/Cargo.toml --all-features --locked
      - shell: pwsh
        run: cargo run --manifest-path experiments/windows-cfapi/Cargo.toml --example export_visual_fixture --locked -- "$env:TWODRIVE_ORDINARY_FIXTURE"
      - shell: pwsh
        run: python scripts/test-generated-visual-dataset.py "$env:TWODRIVE_ORDINARY_FIXTURE"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/capture-native-fixture-evidence.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){throw ($errors | Out-String)}
      - run: cargo build --manifest-path experiments/windows-cfapi/Cargo.toml --features fixture-probe --release --locked
      # No automatic host registration. Native fixture execution is opt-in and
      # separately recorded; compile/unit success is not Explorer acceptance.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-cfapi-probe.ps1 -OutputDirectory "$env:RUNNER_TEMP/cfapi-probe-package"
