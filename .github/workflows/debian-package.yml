name: Recover verified 0.2.19 draft assets
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  upload:
    name: Recover verified draft assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: twodrive-debian
          run-id: 39705432959
          repository: LumiaBlack51/twodrive
          github-token: ${{ github.token }}
          path: payload
      - name: Upload only missing verified artifacts and retain draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          source='f32f5482d7b6991224963256f6874485492211ea'
          repo='LumiaBlack51/twodrive'
          release_id=420226523
          expected=json.loads('{"SHA256SUMS": {"digest": "sha256:9ae7b76cdd3056922b6e527ac7e47acabef62d35c33a1fee581a50f40b3bebe2", "size": 960}, "twodrive-dbgsym_0.2.19-1_amd64.ddeb": {"digest": "sha256:ae640d6f2bfb6975e8e914f95058bf9fb45738768bde328f6fa1c5003a66aa19", "size": 40960352}, "twodrive_0.2.19-1.debian.tar.xz": {"digest": "sha256:cbb293daafd81bcc94b13aaa9c2762f15ef24cf4f53fe7a38fddde4c2efa73c6", "size": 46824}, "twodrive_0.2.19-1.dsc": {"digest": "sha256:1b1453814834d39eebef078f8e3fe445d66d24214325a7bb5889a6fc639c3edb", "size": 1428}, "twodrive_0.2.19-1_amd64.buildinfo": {"digest": "sha256:c48397b1c1d643c19633dfb6d70ad2132d86dd0633a070fc9d8c4e8f43955640", "size": 13168}, "twodrive_0.2.19-1_amd64.changes": {"digest": "sha256:ada4629b79fa45af351a9bfcda832290904ca138e574fc7f5b0ff201463e5cf8", "size": 2782}, "twodrive_0.2.19-1_amd64.deb": {"digest": "sha256:ced67a031da64939468a752e6f27a8467a0310dd7152f93ace94f875a26c5888", "size": 2834998}, "twodrive_0.2.19-1_amd64.deb.sha256": {"digest": "sha256:a7a8d8f8384a3427759f6c7869c4ead4419686af3e30409c3a84e8645c7b5efa", "size": 94}, "twodrive_0.2.19.orig-vendor.tar.xz": {"digest": "sha256:3093e96c4517c2ad4ac5482812ea945505491653c5321b9c9ed2128ad63757f2", "size": 33605288}, "twodrive_0.2.19.orig.tar.xz": {"digest": "sha256:a2ae47936d823bc25ae1fca1b7961e3c7dd854e0c880ec593397229f440fdffa", "size": 1632096}, "verification.json": {"digest": "sha256:5454a1fc3da81c4c148a6b02210b374fae7c2921a8e3281797d8f7879a8d8f43", "size": 4566}}')
          def api(path,method='GET'):
              args=['gh','api',path]
              if method!='GET':args+=['--method',method]
              result=subprocess.check_output(args,text=True)
              return json.loads(result) if result.strip() else None
          run=api('repos/'+repo+'/actions/runs/39705432959')
          assert run['head_sha']==source and run['conclusion']=='success'
          release=api('repos/'+repo+'/releases/'+str(release_id))
          assert release['draft'] and release['tag_name']=='v0.2.19-1' and release['target_commitish']==source
          remote={a['name']:a for a in release['assets']}
          assert set(remote)<=set(expected)
          for name,want in expected.items():
              asset=remote.get(name)
              if asset and asset['state']=='uploaded':
                  assert asset['size']==want['size'] and asset['digest']==want['digest'],name
                  continue
              if asset:
                  assert asset['state']=='starter' and asset['size']==0,name
                  api('repos/'+repo+'/releases/assets/'+str(asset['id']),method='DELETE')
              path=Path('payload')/name
              assert path.is_file() and path.stat().st_size==want['size'],name
              with path.open('rb') as stream:assert 'sha256:'+hashlib.file_digest(stream,'sha256').hexdigest()==want['digest'],name
              subprocess.run(['gh','release','upload','v0.2.19-1',str(path),'--repo',repo],check=True)
              print('Uploaded verified artifact:',name,flush=True)
          final=api('repos/'+repo+'/releases/'+str(release_id))
          assert final['draft'] and {a['name'] for a in final['assets']}==set(expected)
          for a in final['assets']:
              want=expected[a['name']]
              assert a['state']=='uploaded' and a['size']==want['size'] and a['digest']==want['digest']
          print('PASS: all 11 assets verified; release remains a draft')
          PY
