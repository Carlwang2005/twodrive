name: Debian package preparation
on:
  push:
    branches: [dev]
  pull_request:
    paths: ['debian/**', 'scripts/build-deb.sh', 'scripts/test-debian-package.py', 'crates/**', 'Cargo.*', '.github/workflows/debian-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Debian tooling and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python cargo rustc pkgconf libsqlite3-dev lintian python3-gi gir1.2-gtk-4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> debian/cargo-target'
      - name: Provision upstream Cargo cache outside the offline package build
        run: cargo fetch --locked
      - name: Build binary package using debhelper
        # Ubuntu's dpkg database lists an older rustc; the verified rustup
        # toolchain is used here only. Debian archive builds must use apt tools.
        run: bash scripts/build-deb.sh -d -j2
      - name: Verify archive metadata and Lintian
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/old-twodrive.deb https://github.com/LumiaBlack51/twodrive/releases/download/v0.2.14-1/twodrive_0.2.14-1_amd64.deb
          if python3 scripts/test-debian-package.py /tmp/old-twodrive.deb > dist/debian/old-package-regression.log 2>&1; then
            echo 'Expected old package dependency failure was not reproduced'; exit 1
          fi
          grep 'missing generated/runtime dependency: libc6' dist/debian/old-package-regression.log
          python3 scripts/test-debian-package.py dist/debian/twodrive_*_amd64.deb
          lintian --fail-on error dist/debian/twodrive_*_amd64.deb | tee dist/debian/lintian.log
      - name: Install, smoke test and remove in the disposable runner
        run: |
          sudo apt-get install -y ./dist/debian/twodrive_*_amd64.deb
          AUTOPKGTEST_TMP=$(mktemp -d) sh debian/tests/smoke
          sudo apt-get remove -y twodrive
      - name: Build quilt source package from a clean source tree
        run: |
          set -euo pipefail
          upstream=$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')
          stage=$(mktemp -d)
          mkdir "$stage/twodrive-$upstream"
          git archive HEAD | tar -x -C "$stage/twodrive-$upstream"
          git archive --prefix="twodrive-$upstream/" HEAD -- . ':!debian' | xz -T2 > "$stage/twodrive_$upstream.orig.tar.xz"
          (cd "$stage" && dpkg-source --build "twodrive-$upstream")
          cp "$stage"/*.dsc "$stage"/*.tar.xz dist/debian/
          python3 scripts/test-debian-package.py dist/debian/twodrive_*_amd64.deb
          lintian --fail-on error dist/debian/*.dsc | tee dist/debian/lintian-source.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twodrive-debian-preparation
          path: dist/debian/
          if-no-files-found: error
