[package]
name = "twodrive-cfapi-probe"
version = "0.1.7-alpha.1"
edition = "2024"
license = "MIT"
publish = false

# An opt-in native experiment, never loaded by the installed desktop.
[workspace]

[dependencies]
twodrive-core = { path = "../../crates/twodrive-core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_CorrelationVector", "Win32_System_IO", "Win32_Security"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
