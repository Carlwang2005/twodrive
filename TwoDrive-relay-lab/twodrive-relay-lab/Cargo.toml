[package]
name = "twodrive-relay-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Keep this experiment independent when copied under the main TwoDrive repository.
[workspace]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chacha20poly1305 = "0.10"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
open = "5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
sha2 = "0.10"
tiny_http = "0.12"
url = "2.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3"
